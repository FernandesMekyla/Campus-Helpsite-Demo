{% extends "base.html" %}
{% block content %}

<h1> Log a Ticket </h1>

<p>Use this form to report an IT issuu on campus</p>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="post" class="form">
    <label for="title">Title</label><br />
    <input id="title" name="title" type="text" maxlength="120" required /><br> <br>

    <label for="description">Description</label><br />
    <textarea id="description" name="description" rows="6" maxlength="500" required></textarea><br><br>

    <button class="btn" type="submit">Submit Ticket</button>
    <a class="btn" href="{{ url_for('tickets') }}">Cancel</a>

</form>

{% endblock %}
