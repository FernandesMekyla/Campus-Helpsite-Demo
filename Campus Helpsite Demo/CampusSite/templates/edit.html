{% extends "base.html" %}
{% block content %}
<h1> Edit Ticket #{{ ticket[0] }} </h1>

{% if error %}
<p class="error">{{ error }}</p>
{% endif %}

<form method="post" class="form">
    <label for="title">Title</label><br />
    <input id="title" name="title" type="text" maxlength="120" value="{{ ticket[1] }}" required /><br /><br />

    <label for="description">Description</label><br />
    <textarea id="description" name="description" rows="6" maxlength="500" required>{{ ticket[2] }}</textarea><br /><br />

    <label for="status">Status</label><br />
    <select id="status" name="status" required>
        <option value="open" selected="{{ 'selected' if ticket[3] == 'open' else '' }}">open</option>
        <option value="closed" {{ 'selected' if ticket[3] == 'closed' }}>closed</option>
    </select><br /><br />

    <button class="btn" type="submit">Save Changes</button>
    <a class="btn" href="{{ url_for('tickets') }}">Cancel</a>
</form>

<form method="post" action="{{ url_for('delete_ticket', ticket_id=ticket[0]) }}" style="margin-top: 1rem;">
    <button type="submit">Delete Ticket</button>
</form>
{% endblock %}
