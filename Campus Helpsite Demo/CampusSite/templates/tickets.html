{% extends "base.html" %}
{% block content %}
<h1>Tickets</h1>

<p>
    <a class="btn" href="{{ url_for('new_ticket') }}">Log a Ticket</a>
</p>

<ul class="tickets">
    {% for t in tickets %}
    <li class="ticket">
        <strong>#{{ t[0] }} {{ t[1] }}</strong>
        <span class="status">{{ t[3] }}</span><br>
        <div class="desc">{{ t[2] }}</div>

        <a href="{{ url_for('edit_ticket', ticket_id=t[0]) }}">Edit</a>

        <form method="post" action="{{ url_for('delete_ticket', ticket_id=t[0]) }}" style="display:inline;">
            <button type="submit">Delete</button>
        </form>
    </li>
    {% else %}
    <li>No tickets yet - log the first one.</li>
    {% endfor %}
</ul>

{% endblock %}
